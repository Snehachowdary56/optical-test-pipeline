name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Run the pipeline on sample data
        run: python -m otp --generate

      - name: Evaluate the chatbot (fails below 95% accuracy)
        run: |
          python -m otp.chat.evaluate --min-accuracy 0.95
          cat eval/results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Try the chatbot in the terminal
        run: printf 'What is the yield?\nCompare stations\nwhat about station B?\nWhich devices failed?\nWhat is the capital of France?\nquit\n' | python -m otp.chat

      - name: Upload the report and evaluation
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            output/report.html
            eval/results.md
            eval/results.json
